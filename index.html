<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equivalent Fractions Practice</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 900px; width: 100%; }
    h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }

    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
    .btn { flex: 1; min-width: 220px; padding: 14px; color: white; border: none; border-radius: 8px; font-size: 1.05em; cursor: pointer; transition: background 0.25s; }
    .btn-check { background: #2ecc71; }
    .btn-check:hover { background: #27ae60; }
    .btn-new { background: #3498db; }
    .btn-new:hover { background: #2e86c1; }

    .question-block { margin: 26px 0; border-bottom: 1px dashed #ccc; padding-bottom: 18px; }
    .question-title { margin: 0 0 8px; }
    .visual-area { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 14px 0 6px; }

    .fraction-item { text-align: center; margin: 10px; }
    .pie-svg { cursor: pointer; transition: transform 0.2s; }
    .pie-svg:hover { transform: scale(1.05); }

    .slice { fill: white; stroke: #333; stroke-width: 2; transition: fill 0.25s; }
    .slice.active { fill: #3498db; }

    input[type="text"] { width: 70px; text-align: center; padding: 6px; font-size: 1.1em; border: 2px solid #bdc3c7; border-radius: 6px; margin-top: 10px; }
    .correct { border-color: #27ae60 !important; background-color: #e8f8f5; }
    .wrong { border-color: #e74c3c !important; background-color: #fdedec; }

    .feedback { text-align: center; font-weight: bold; margin-top: 10px; min-height: 22px; }
    .qfeedback { text-align: center; font-weight: 600; margin-top: 10px; min-height: 20px; }
    .muted { color: #6b7280; font-size: 0.95em; text-align: center; margin-top: 10px; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Equivalent Fractions Practice</h1>

    <div class="controls">
      <button class="btn btn-new" onclick="newQuiz()">New Random Quiz</button>
      <button class="btn btn-check" onclick="checkAnswers()">Check My Answers</button>
    </div>

    <div class="muted">Click slices to color them. Type the matching fraction under each pie.</div>

    <div id="quiz"></div>

    <div class="feedback" id="globalFeedback"></div>
  </div>

<script>
  // ---------- Math helpers ----------
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b !== 0) { const t = b; b = a % b; a = t; }
    return a;
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Pick a "nice" base fraction a/b, reduced, with small denominators.
  function randomReducedFraction() {
    const b = randInt(2, 6); // keeps pies clickable
    let a = randInt(1, b - 1);
    while (gcd(a, b) !== 1) a = randInt(1, b - 1);
    return { a, b };
  }

  // Choose 3 denominators that are multiples of b, but not too large.
  function chooseDenominators(b) {
    const multipliers = shuffle([2, 3, 4, 5, 6].filter(m => b * m <= 12)); // cap slices at 12
    // Fallback if b is big and filter got small
    if (multipliers.length < 3) {
      const fallback = shuffle([2, 3, 4].filter(m => b * m <= 12));
      while (fallback.length < 3) fallback.push(2);
      return fallback.slice(0, 3).map(m => b * m);
    }
    return multipliers.slice(0, 3).map(m => b * m);
  }

  // ---------- SVG pie generation ----------
  function createPie(svgEl, numSlices) {
    svgEl.innerHTML = "";
    const radius = 50;

    for (let i = 0; i < numSlices; i++) {
      const startAngle = (i * 2 * Math.PI) / numSlices;
      const endAngle = ((i + 1) * 2 * Math.PI) / numSlices;

      const x1 = radius * Math.sin(startAngle);
      const y1 = -radius * Math.cos(startAngle);
      const x2 = radius * Math.sin(endAngle);
      const y2 = -radius * Math.cos(endAngle);

      const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;

      const pathData = `M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", pathData);
      path.setAttribute("class", "slice");
      path.addEventListener("click", () => toggleSlice(path));
      svgEl.appendChild(path);
    }
  }

  function toggleSlice(el) {
    el.classList.toggle("active");
  }

  // ---------- Quiz building ----------
  function buildQuestionBlock(qIndex, baseFrac) {
    const { a, b } = baseFrac;
    const denoms = chooseDenominators(b); // 3 denominators

    const block = document.createElement("div");
    block.className = "question-block";
    block.dataset.qindex = String(qIndex);

    const prompt = document.createElement("p");
    prompt.className = "question-title";
    prompt.innerHTML = `<strong>${qIndex}. Create three fractions equivalent to ${a}/${b}.</strong> Click the slices to color them and type the fraction below.`;
    block.appendChild(prompt);

    const visual = document.createElement("div");
    visual.className = "visual-area";

    denoms.forEach((d, i) => {
      const mult = d / b;
      const expectedNum = a * mult;
      const expected = `${expectedNum}/${d}`;

      const item = document.createElement("div");
      item.className = "fraction-item";

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "100");
      svg.setAttribute("height", "100");
      svg.setAttribute("viewBox", "-50 -50 100 100");
      svg.classList.add("pie-svg");
      svg.dataset.slices = String(d);

      createPie(svg, d);

      const br = document.createElement("br");

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `? / ${d}`;
      input.dataset.answer = expected;

      // clear styling on edit
      input.addEventListener("input", () => {
        input.classList.remove("correct", "wrong");
      });

      item.appendChild(svg);
      item.appendChild(br);
      item.appendChild(input);
      visual.appendChild(item);
    });

    block.appendChild(visual);

    const qfb = document.createElement("div");
    qfb.className = "qfeedback";
    qfb.id = `qfb-${qIndex}`;
    block.appendChild(qfb);

    return block;
  }

  function newQuiz() {
    const quiz = document.getElementById("quiz");
    const globalFeedback = document.getElementById("globalFeedback");
    quiz.innerHTML = "";
    globalFeedback.textContent = "";
    globalFeedback.style.color = "";

    const numQuestions = 4; // change this if you want more
    for (let i = 1; i <= numQuestions; i++) {
      quiz.appendChild(buildQuestionBlock(i, randomReducedFraction()));
    }
  }

  // ---------- Checking logic ----------
  function parseFraction(text) {
    const cleaned = text.trim().replace(/\s/g, "");
    const parts = cleaned.split("/");
    if (parts.length !== 2) return null;
    const n = parseInt(parts[0], 10);
    const d = parseInt(parts[1], 10);
    if (!Number.isFinite(n) || !Number.isFinite(d) || d === 0) return null;
    return { n, d, raw: `${n}/${d}` };
  }

  function checkAnswers() {
    const blocks = document.querySelectorAll(".question-block");
    const globalFeedback = document.getElementById("globalFeedback");
    let everythingCorrect = true;

    blocks.forEach(block => {
      const qIndex = block.dataset.qindex;
      const inputs = block.querySelectorAll("input");
      const qfb = block.querySelector(`#qfb-${qIndex}`);

      let blockCorrect = true;

      inputs.forEach(input => {
        const expected = input.dataset.answer; // like "3/6"
        const parsed = parseFraction(input.value);

        const parent = input.closest(".fraction-item");
        const activeSlices = parent.querySelectorAll(".slice.active").length;

        if (!parsed) {
          input.classList.remove("correct");
          input.classList.add("wrong");
          blockCorrect = false;
          return;
        }

        // Must match expected text AND must have colored slices equal to numerator
        if (parsed.raw === expected && parsed.n === activeSlices) {
          input.classList.remove("wrong");
          input.classList.add("correct");
        } else {
          input.classList.remove("correct");
          input.classList.add("wrong");
          blockCorrect = false;
        }
      });

      if (blockCorrect) {
        qfb.textContent = "✅ Nice. This question is correct.";
        qfb.style.color = "#27ae60";
      } else {
        qfb.textContent = "❌ Check the fraction text and the colored slices.";
        qfb.style.color = "#e74c3c";
        everythingCorrect = false;
      }
    });

    if (everythingCorrect) {
      globalFeedback.textContent = "🌟 Excellent! All fractions and visuals match!";
      globalFeedback.style.color = "#27ae60";
    } else {
      globalFeedback.textContent = "Not quite. Fix the red ones and try again.";
      globalFeedback.style.color = "#e74c3c";
    }
  }

  // Start with a quiz
  newQuiz();
</script>
</body>
</html>
