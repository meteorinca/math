<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equivalent Fractions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .question-block { margin-bottom: 40px; border-bottom: 1px dashed #ccc; padding-bottom: 20px; }
        .visual-area { display: flex; justify-content: space-around; flex-wrap: wrap; margin: 20px 0; }
        
        .fraction-item { text-align: center; margin: 10px; }
        .pie-svg { cursor: pointer; transition: transform 0.2s; }
        .pie-svg:hover { transform: scale(1.05); }
        .slice { fill: white; stroke: #333; stroke-width: 2; transition: fill 0.3s; }
        .slice.active { fill: #3498db; }
        
        input[type="text"] { width: 50px; text-align: center; padding: 5px; font-size: 1.1em; border: 2px solid #bdc3c7; border-radius: 4px; margin-top: 10px; }
        .correct { border-color: #27ae60 !important; background-color: #e8f8f5; }
        .wrong { border-color: #e74c3c !important; background-color: #fdedec; }

        .btn-check { display: block; width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; transition: background 0.3s; }
        .btn-check:hover { background: #27ae60; }
        .feedback { text-align: center; font-weight: bold; margin-top: 15px; height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Equivalent Fractions Practice</h1>
    
    <div class="question-block" id="q1">
        <p><strong>1. Create three fractions equivalent to 1/2.</strong> Click the slices to color them and type the fraction below.</p>
        <div class="visual-area">
            <div class="fraction-item">
                <svg width="100" height="100" viewBox="-50 -50 100 100" class="pie-svg" data-slices="4">
                    <path class="slice" d="M 0 0 L 0 -50 A 50 50 0 0 1 50 0 Z" onclick="toggleSlice(this)"></path>
                    <path class="slice" d="M 0 0 L 50 0 A 50 50 0 0 1 0 50 Z" onclick="toggleSlice(this)"></path>
                    <path class="slice" d="M 0 0 L 0 50 A 50 50 0 0 1 -50 0 Z" onclick="toggleSlice(this)"></path>
                    <path class="slice" d="M 0 0 L -50 0 A 50 50 0 0 1 0 -50 Z" onclick="toggleSlice(this)"></path>
                </svg><br>
                <input type="text" placeholder="? / 4" data-answer="2/4">
            </div>

            <div class="fraction-item">
                <svg width="100" height="100" viewBox="-50 -50 100 100" class="pie-svg" id="pie-6" data-slices="6"></svg><br>
                <input type="text" placeholder="? / 6" data-answer="3/6">
            </div>

            <div class="fraction-item">
                <svg width="100" height="100" viewBox="-50 -50 100 100" class="pie-svg" id="pie-8" data-slices="8"></svg><br>
                <input type="text" placeholder="? / 8" data-answer="4/8">
            </div>
        </div>
    </div>

    <button class="btn-check" onclick="checkAnswers()">Check My Answers</button>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    // Helper to generate SVG slices dynamically for complex circles
    function createPie(elementId, numSlices) {
        const svg = document.getElementById(elementId);
        const radius = 50;
        for (let i = 0; i < numSlices; i++) {
            const startAngle = (i * 2 * Math.PI) / numSlices;
            const endAngle = ((i + 1) * 2 * Math.PI) / numSlices;
            const x1 = radius * Math.sin(startAngle);
            const y1 = -radius * Math.cos(startAngle);
            const x2 = radius * Math.sin(endAngle);
            const y2 = -radius * Math.cos(endAngle);
            const largeArc = 0;
            
            const pathData = `M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("class", "slice");
            path.setAttribute("onclick", "toggleSlice(this)");
            svg.appendChild(path);
        }
    }

    function toggleSlice(el) {
        el.classList.toggle('active');
    }

    function checkAnswers() {
        const inputs = document.querySelectorAll('input');
        const feedback = document.getElementById('feedback');
        let allCorrect = true;

        inputs.forEach(input => {
            const val = input.value.trim().replace(/\s/g, '');
            const expected = input.dataset.answer;
            
            // Logic: Check if fraction text matches AND if visual slices match the numerator
            const parent = input.closest('.fraction-item');
            const activeSlices = parent.querySelectorAll('.slice.active').length;
            const numerator = val.split('/')[0];

            if (val === expected && parseInt(numerator) === activeSlices) {
                input.className = 'correct';
            } else {
                input.className = 'wrong';
                allCorrect = false;
            }
        });

        if (allCorrect) {
            feedback.innerHTML = "🌟 Excellent! All fractions and visuals match!";
            feedback.style.color = "#27ae60";
        } else {
            feedback.innerHTML = "Not quite! Check your fractions and colored slices.";
            feedback.style.color = "#e74c3c";
        }
    }

    // Initialize the pies
    createPie('pie-6', 6);
    createPie('pie-8', 8);
</script>

</body>
</html>
